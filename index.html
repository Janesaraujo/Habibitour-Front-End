<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habibi Tour</title>

<!-- Tailwind (via CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- GSAP (3.13+ — SplitText is a free core plugin since GSAP went 100% free) -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>

<link rel="stylesheet" href="css/styles.css">
</head>

<body class="text-pearl">

<!-- ============ HERO ============ -->
<!-- The nav, side pagination, bottom controls and the 3-card container are
     created ONCE and never removed or recreated. Only the inner content
     (background image, title, description, each card's photo/name) is
     updated on every navigation. This avoids any layout "flash". -->
<section id="hero" class="relative w-full min-h-screen md:h-screen">

  <div id="bgFallback"></div>
  <div id="bgA"></div>
  <div id="bgB"></div>
  <div class="hero-overlay"></div>
  <div class="hero-overlay-bottom"></div>

  <!-- ===== Navbar (liquid glass, floating) ===== -->
  <nav class="liquid-glass relative z-20 flex items-center justify-between mx-4 md:mx-8 2xl:mx-10 mt-5 2xl:mt-7 px-6 md:px-8 2xl:px-11 py-3.5 2xl:py-5 rounded-2xl 2xl:rounded-[28px]">
    <div class="flex items-center gap-2 2xl:gap-3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="text-sand 2xl:w-8 2xl:h-8">
        <path d="M12 2 L14.5 9 L22 9 L16 13.5 L18 21 L12 16.5 L6 21 L8 13.5 L2 9 L9.5 9 Z" fill="currentColor"/>
      </svg>
      <span class="text-lg 2xl:text-2xl font-bold tracking-tight">Habibi Tour</span>
    </div>

    <div class="hidden md:flex items-center gap-10 2xl:gap-14 text-sm 2xl:text-lg text-pearl/80">
      <a href="#" class="hover:text-white transition">Destinations</a>
      <a href="#" class="hover:text-white transition">Itineraries</a>
      <a href="#" class="hover:text-white transition">Contact</a>
    </div>

    <div class="flex items-center gap-4 2xl:gap-5">
      <button aria-label="Search" class="liquid-glass-soft w-9 h-9 2xl:w-12 2xl:h-12 rounded-full hover:bg-white/20 transition flex items-center justify-center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <span class="hidden sm:block text-sm 2xl:text-lg text-pearl/80">Hello, Traveler!</span>
    </div>
  </nav>

  <!-- ===== Side pagination (far left) — numbers only, minimalist =====
       No text labels: just 01/02/03/04, with the active one highlighted
       in gold. Clickable to jump straight to a destination. -->
  <div id="pageIndicator" class="hidden md:flex flex-col items-center gap-5 2xl:gap-7 absolute left-8 2xl:left-12 top-1/2 -translate-y-1/2 z-20">
    <!-- 01–04 numbers injected via JS -->
  </div>

  <!-- ===== Main content (left-aligned text) =====
       On mobile this is a normal in-flow block (not h-full/centered) so
       it only takes the height its content needs, leaving room for the
       card row below it. md+ restores the original centered layout. -->
  <div class="relative z-20 md:h-full flex flex-col justify-start md:justify-center px-8 md:px-24 2xl:px-32 max-w-2xl 2xl:max-w-[940px] pt-28 pb-10 md:pt-0 md:pb-0">
    <p id="eyebrow" class="text-sand text-xs 2xl:text-sm tracking-[0.35em] uppercase mb-4 2xl:mb-6">United Arab Emirates</p>

    <h1 id="title" class="text-[clamp(2.25rem,15vw,3.75rem)] md:text-[clamp(2.75rem,6.5vw,5rem)] 2xl:text-[clamp(3.5rem,6.5vw,7rem)] leading-[0.9] font-extrabold uppercase tracking-tight">
      <span id="titleLine1" class="title-line">Palm</span>
      <span id="titleLine2" class="title-line">Jumeirah</span>
    </h1>

    <p id="desc" class="mt-6 2xl:mt-8 text-sm md:text-base 2xl:text-lg text-pearl/75 leading-relaxed max-w-md 2xl:max-w-xl">
      A palm-shaped island rising from the sea, framed by five-star resorts and
      private beaches — a symbol of Dubai's architectural ambition.
    </p>

    <button id="exploreBtn" class="liquid-glass mt-9 2xl:mt-12 w-fit flex items-center gap-3 2xl:gap-4 text-sand font-semibold text-sm 2xl:text-base px-6 2xl:px-9 py-3.5 2xl:py-5 rounded-full hover:bg-white/10 transition">
      Explore
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <!-- ===== Card slider (3 FIXED slots — never created/removed) =====
       Mobile: normal in-flow block, right below the text — a
       horizontally swipeable row (native scroll + snap), so it never
       fights the text for space. md+: back to absolute, floating
       beside the text, exactly as before. -->
  <div id="cardTrack" class="relative md:absolute z-20 md:right-10 2xl:right-14 md:top-1/2 md:-translate-y-1/2 flex gap-5 2xl:gap-7 items-end overflow-x-auto md:overflow-visible snap-x snap-mandatory md:snap-none px-8 md:px-0 pt-8 md:pt-0 pb-6 md:pb-0">
    <!-- Slots 0, 1, 2 — generated once by JS on load -->
  </div>

  <!-- ===== Bottom controls (liquid glass) =====
       Mobile: normal in-flow block, centered under the card row (same
       fix as the card track — an absolute bottom-9 here would collide
       with the row on short/narrow screens once it's in-flow). md+:
       back to floating over the hero, exactly as before. -->
  <div id="bottomControls" class="liquid-glass relative md:absolute z-20 md:bottom-9 2xl:bottom-12 mx-auto md:left-1/2 md:-translate-x-1/2 w-fit flex items-center gap-5 2xl:gap-7 rounded-full pl-2 pr-2 2xl:pl-3 2xl:pr-3 py-2 2xl:py-3 mb-10 md:mb-0">
    <button id="prevBtn" aria-label="Previous destination" class="arrow-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span id="counterLabel" class="text-xs 2xl:text-sm tracking-widest text-pearl/60">01 / 04</span>
    <button id="nextBtn" aria-label="Next destination" class="arrow-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
